<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<style>
		* { box-sizing: border-box; }
		body {
			width: 260px;
			font-family: monospace;
			background: #1a1a2e;
			color: #ccc;
			margin: 0;
			padding: 14px;
		}
		h2 { margin: 0 0 12px; font-size: 13px; color: #00d4aa; letter-spacing: 0.5px; }
		label {
			display: block; font-size: 10px; color: #888;
			margin: 8px 0 2px; text-transform: uppercase; letter-spacing: 0.6px;
		}
		input[type="text"], input[type="password"] {
			width: 100%; padding: 5px 7px;
			background: #0d0d1a; border: 1px solid #333; border-radius: 3px;
			color: #eee; font: 12px monospace; outline: none;
		}
		input:focus { border-color: #00d4aa; }
		.row { display: flex; gap: 6px; margin-top: 12px; }
		button {
			flex: 1; padding: 6px 0; border: none; border-radius: 3px;
			font: bold 11px monospace; cursor: pointer;
		}
		#btn-save		 { background: #00d4aa; color: #0d0d1a; }
		#btn-save:hover { background: #00b890; }
		#btn-go			 { background: #2a2a4a; color: #00d4aa; border: 1px solid #00d4aa; }
		#btn-go:hover { background: #1a1a3e; }
		#btn-register, #btn-visa { background: #2a1a4a; color: #d4a0ff; border: 1px solid #9060cc; }
		#btn-register:hover, #btn-visa:hover { background: #1a0a3e; }
		#status { margin-top: 10px; font-size: 11px; min-height: 14px; color: #00d4aa; }
		#status.error { color: #ff6b6b; }
		hr { border: none; border-top: 1px solid #222; margin: 10px 0; }
		#sw-status { font-size: 10px; color: #555; }
		.toggle-pair { display: flex; gap: 0; margin-top: 4px; }
		.toggle-pair button {
			flex: 1; padding: 5px 0; border: 1px solid #333; border-radius: 0;
			background: #0d0d1a; color: #666; font: bold 10px monospace; cursor: pointer;
		}
		.toggle-pair button:first-child { border-radius: 3px 0 0 3px; }
		.toggle-pair button:last-child	{ border-radius: 0 3px 3px 0; border-left: none; }
		.toggle-pair button.active { background: #9060cc; color: #fff; border-color: #9060cc; }
		.toggle-pair button.reserved { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
		select.dark {
			width: 100%; padding: 4px 6px; margin-top: 4px;
			background: #0d0d1a; border: 1px solid #333; border-radius: 3px;
			color: #eee; font: 11px monospace; outline: none;
		}
		.chk-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 10px; color: #888; }
		.chk-row input { accent-color: #9060cc; }
	</style>
</head>
<body>

	<h2>Sigal Forge</h2>

	<hr/>	

	<h4>Apply</h4>

	<label for="inp-user">Username</label>
	<input id="inp-user" type="text" placeholder="username" autocomplete="off" />

	<label for="inp-pass">Password</label>
	<input id="inp-pass" type="password" placeholder="••••••••" />

	<div class="row">
		<button id="btn-login-idle">Login</button>
		<button id="btn-login-apply">Apply</button>
	</div>

	<hr />

			<label for="inp-rp-lastname">Last Name</label>
			<input id="inp-rp-lastname" type="text" placeholder="Last name" autocomplete="off" />
			<label for="inp-rp-dob">Birth Date</label>
			<input id="inp-rp-dob" type="text" placeholder="YYYY/MM/DD" autocomplete="off" />
			<label for="sel-rp-gender">Gender</label>
			<select id="sel-rp-gender" class="dark">
				<option value="M">Male</option>
				<option value="F">Female</option>
			</select>
			<label for="inp-rp-traveldoc">Passport No.</label>
			<input id="inp-rp-traveldoc" type="text" placeholder="AB123456" autocomplete="off" />
			<div class="row" style="margin-top:4px">
				<button id="btn-rp-generate">Generate</button>
				<button id="btn-rp-validate">Validate</button>
			</div>
		</div>

	</div>

	<label for="inp-visa-posto">Consular Post ID</label>
	<input id="inp-visa-posto" type="text" placeholder="5084" value="5084" autocomplete="off" />

	<div class="toggle-pair">
		<button id="btn-trigger-auto" class="active">Auto Trigger</button>
		<button id="btn-trigger-signal">Signal Trigger</button>
	</div>

	<div class="row">
		<button id="btn-register-idle">Register</button>
		<button id="btn-register-login">Login</button>
		<button id="btn-register-apply">Apply</button>
	</div>

	<hr/>

	<h4>Options</h4>

	<label for="sel-solver">reCAPTCHA Solver</label>
	<select id="sel-solver" class="dark">
		<option value="capsolver">CapSolver</option>
		<option value="anti-captcha">Anti-Captcha</option>
		<option value="capmonster">CapMonster</option>
		<option value="2captcha">2Captcha</option>
	</select>

	<label>Email Provider</label>
	<div class="toggle-pair">
		<button id="btn-email-mailtm" class="active">mail.tm</button>
		<button id="btn-email-cf">Cloudflare</button>
	</div>

	<div class="chk-row">
		<input type="checkbox" id="chk-solver-parallel" />
		<span style="font-size:11px">All solvers run in parallel — first result wins</span>
	</div>

	<div class="chk-row">
		<input type="checkbox" id="chk-pre-visit-warmup" />
		<span style="font-size:11px">Enable Pre-Visit Warm Up Browsing</span>
	</div>

	<div class="chk-row">
		<input type="checkbox" id="chk-lang-change" />
		<span style="font-size:11px">Enable Language Change to English</span>
	</div>

	<hr />

	<h4>Status</h4>

	<div id="sw-status">Checking extension…</div>
	<p id="status"></p>

	<script src="constants.js"></script>
	<script src="popup.js"></script>
</body>
