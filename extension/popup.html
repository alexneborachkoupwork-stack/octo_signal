<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      width: 260px;
      font-family: monospace;
      background: #1a1a2e;
      color: #ccc;
      margin: 0;
      padding: 14px;
    }
    h2 { margin: 0 0 12px; font-size: 13px; color: #00d4aa; letter-spacing: 0.5px; }
    label {
      display: block; font-size: 10px; color: #888;
      margin: 8px 0 2px; text-transform: uppercase; letter-spacing: 0.6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 5px 7px;
      background: #0d0d1a; border: 1px solid #333; border-radius: 3px;
      color: #eee; font: 12px monospace; outline: none;
    }
    input:focus { border-color: #00d4aa; }
    .row { display: flex; gap: 6px; margin-top: 12px; }
    button {
      flex: 1; padding: 6px 0; border: none; border-radius: 3px;
      font: bold 11px monospace; cursor: pointer;
    }
    #btn-save     { background: #00d4aa; color: #0d0d1a; }
    #btn-save:hover { background: #00b890; }
    #btn-go       { background: #2a2a4a; color: #00d4aa; border: 1px solid #00d4aa; }
    #btn-go:hover { background: #1a1a3e; }
    #btn-register { background: #2a1a4a; color: #d4a0ff; border: 1px solid #9060cc; }
    #btn-register:hover { background: #1a0a3e; }
    #status { margin-top: 10px; font-size: 11px; min-height: 14px; color: #00d4aa; }
    #status.error { color: #ff6b6b; }
    hr { border: none; border-top: 1px solid #222; margin: 10px 0; }
    #sw-status { font-size: 10px; color: #555; }
    .toggle-pair { display: flex; gap: 0; margin-top: 4px; }
    .toggle-pair button {
      flex: 1; padding: 5px 0; border: 1px solid #333; border-radius: 0;
      background: #0d0d1a; color: #666; font: bold 10px monospace; cursor: pointer;
    }
    .toggle-pair button:first-child { border-radius: 3px 0 0 3px; }
    .toggle-pair button:last-child  { border-radius: 0 3px 3px 0; border-left: none; }
    .toggle-pair button.active { background: #9060cc; color: #fff; border-color: #9060cc; }
    .toggle-pair button.reserved { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    select.dark {
      width: 100%; padding: 4px 6px; margin-top: 4px;
      background: #0d0d1a; border: 1px solid #333; border-radius: 3px;
      color: #eee; font: 11px monospace; outline: none;
    }
    .chk-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 10px; color: #888; }
    .chk-row input { accent-color: #9060cc; }
  </style>
</head>
<body>
  <h2>⬡ Octo Probe</h2>

  <label for="inp-user">Username / Email</label>
  <input id="inp-user" type="text" placeholder="user@example.com" autocomplete="off" />

  <label for="inp-pass">Password</label>
  <input id="inp-pass" type="password" placeholder="••••••••" />

  <div class="row">
    <button id="btn-save">Save</button>
    <button id="btn-go">Login</button>
  </div>

  <div class="row">
    <button id="btn-register">Register (auto)</button>
  </div>

  <div style="margin-top:6px">
    <label style="margin:0 0 2px">Idle Warmup</label>
    <div class="toggle-pair">
      <button id="btn-warmup-on">On</button>
      <button id="btn-warmup-off" class="active">Off</button>
    </div>
  </div>

  <div style="margin-top:6px">
    <label style="margin:0 0 2px">After Register</label>
    <div class="toggle-pair">
      <button id="btn-chain-none" class="active">Save only</button>
      <button id="btn-chain-visa">&#x2192; Login + Visa</button>
    </div>
  </div>

  <p id="status"></p>

  <hr />

  <label>reCAPTCHA Mode</label>
  <div class="toggle-pair">
    <button id="btn-human">Human</button>
    <button id="btn-api" class="active">API</button>
  </div>

  <div id="api-opts" style="display:none">
    <label for="sel-solver" style="margin-top:8px">Solver</label>
    <select id="sel-solver" class="dark">
      <option value="capsolver">CapSolver</option>
      <option value="anti-captcha">Anti-Captcha</option>
      <option value="capmonster">CapMonster</option>
      <option value="2captcha">2Captcha</option>
    </select>
    <div class="chk-row">
      <input type="checkbox" id="chk-parallel" />
      <span>Parallel mode (race all solvers)</span>
    </div>
  </div>

  <hr />

  <label>Email Provider</label>
  <div class="toggle-pair">
    <button id="btn-email-mailtm" class="active">mail.tm</button>
    <button id="btn-email-cf">Cloudflare</button>
  </div>

  <div id="cf-opts" style="display:none;margin-top:8px">
    <label for="cf-domain">Email Domain</label>
    <input id="cf-domain" type="text" placeholder="mail.yourdomain.com" autocomplete="off" />
    <label for="cf-worker">Worker URL</label>
    <input id="cf-worker" type="text" placeholder="https://octo-mail-recv.yourname.workers.dev" autocomplete="off" />
    <label for="cf-secret">API Secret</label>
    <input id="cf-secret" type="password" placeholder="your-api-secret" autocomplete="off" />
  </div>

  <hr />

  <div id="visa-section">
    <label style="color:#9060cc;font-size:10px;text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:4px">Visa Appointment</label>

    <label for="visa-arrival">Arrival Date (yyyy/mm/dd)</label>
    <input id="visa-arrival" type="text" placeholder="2026/10/21" autocomplete="off" />

    <label for="visa-posto">Consular Post ID</label>
    <input id="visa-posto" type="text" placeholder="5088" autocomplete="off" />

    <div class="row" style="margin-top:10px">
      <button id="btn-visa" style="background:#2a1a4a;color:#d4a0ff;border:1px solid #9060cc;flex:1">Apply for Visa</button>
    </div>
  </div>

  <hr />

  <div id="real-person-section">
    <label style="color:#9060cc;font-size:10px;text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:4px">Real Person Data</label>

    <label for="rp-firstname">First Name</label>
    <input id="rp-firstname" type="text" placeholder="ADILENE MEGANE" autocomplete="off" />

    <label for="rp-lastname">Last Name</label>
    <input id="rp-lastname" type="text" placeholder="BRITO SOARES" autocomplete="off" />

    <label for="rp-dob">Date of Birth</label>
    <input id="rp-dob" type="text" placeholder="07-05-2009" autocomplete="off" />

    <label for="rp-gender">Gender</label>
    <select id="rp-gender" class="dark">
      <option value="">— select —</option>
      <option value="F">F — Female</option>
      <option value="M">M — Male</option>
    </select>

    <label for="rp-nationality">Nationality</label>
    <input id="rp-nationality" type="text" placeholder="CABO-VERDIANA" autocomplete="off" />

    <label for="rp-traveldoc">Passport / Travel Doc</label>
    <input id="rp-traveldoc" type="text" placeholder="PA551574" autocomplete="off" />

    <label for="rp-surname-birth">Surname(s) at Birth</label>
    <input id="rp-surname-birth" type="text" placeholder="BRITO SOARES" autocomplete="off" />

    <label for="rp-place-birth">Place of Birth (city)</label>
    <input id="rp-place-birth" type="text" placeholder="PRAIA" autocomplete="off" />

    <label for="rp-passport-issue">Passport Issue Date (yyyy/mm/dd)</label>
    <input id="rp-passport-issue" type="text" placeholder="2020/03/15" autocomplete="off" />

    <label for="rp-passport-expiry">Passport Valid Until (yyyy/mm/dd)</label>
    <input id="rp-passport-expiry" type="text" placeholder="2030/03/14" autocomplete="off" />

    <div class="row" style="margin-top:10px">
      <button id="btn-reg-real" style="background:#2a1a4a;color:#d4a0ff;border:1px solid #9060cc;flex:2">Register</button>
      <button id="btn-rp-clear" style="background:#1a1a2e;color:#666;border:1px solid #333;flex:1">Clear</button>
    </div>
  </div>

  <hr />
  <div id="sw-status">Checking extension…</div>

  <script src="popup.js"></script>
</body>
</html>
